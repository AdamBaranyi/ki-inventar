name: CI

# Bei jedem Push auf main und jedem Pull Request: alle Prüfungen, dann der Build.
# Nur von main aus geht der geprüfte Build auf GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefung:
    name: Prüfen und bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Abhängigkeiten
        run: bun install --frozen-lockfile

      # Blockiert ab high; Stufe und Ausnahmen stehen in scripts/audit.sh.
      - name: Sicherheitslücken ab high
        run: bash scripts/audit.sh high

      # Binärdatei statt Action, mit geprüfter Prüfsumme aus dem Release.
      # Dieselbe Fassung wie in sicherheit-taeglich.yml.
      - name: gitleaks 8.30.1 holen
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Secret-Scan über alle Commits
        run: ./gitleaks git . --no-banner --redact

      - name: Quelltext-Regeln
        run: bun run pruefe

      - name: Unit-Tests (Regeln, Daten)
        run: bun run test

      - name: Tests der Sicherheitsskripte
        run: bun run test:skripte

      - name: Build für GitHub Pages
        run: bun run build

      - name: Chromium für Playwright
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Browser-Tests (375, 390 und 1280 px)
        run: bun run test:e2e

      - name: Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-bericht
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Seite für Pages bereitstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/ki-inventar/browser

  # Das Abbild für vps1 entsteht auf dem Server; hier wird es genauso gebaut
  # und von aussen geprüft, damit ein Fehler nicht erst beim Ausrollen auffällt.
  abbild:
    name: Produktionsabbild für vps1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Abbild bauen und von aussen prüfen
        run: bash scripts/abbild-pruefen.sh

  veroeffentlichen:
    name: Auf GitHub Pages
    needs: pruefung
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
